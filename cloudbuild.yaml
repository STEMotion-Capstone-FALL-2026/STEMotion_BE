# Cloud Build is used for the initial build when Docker is unavailable locally.
# No credentials or .env files are uploaded (see .gcloudignore).
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:${_TAG}'
      - .
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:${_TAG}'
substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: stemotion
  _TAG: staging
timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
