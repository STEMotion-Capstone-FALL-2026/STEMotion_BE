name: CI

on:
  push:
    branches: [main, deploy/render-staging]
  pull_request:
    branches: [main]

concurrency:
  # A new push supersedes the run still going for the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai:
    name: AI service contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai/requirements.lock
      - run: pip install -r requirements.lock
      - run: pytest -q

  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stemotion_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn -B -ntp compile

      - name: Unit tests
        run: mvn -B -ntp test

      # Proves the migrations build the schema the entities expect. The app
      # runs with ddl-auto=validate, so a drifted migration fails right here
      # instead of on someone's machine.
      - name: Verify Flyway migrations against a real Postgres
        env:
          DB_URL: jdbc:postgresql://localhost:5433/stemotion_db
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-secret-key-long-enough-for-hmac-sha-512-signing
        run: |
          mvn -B -ntp spring-boot:run &
          APP_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Application started"
              kill $APP_PID
              exit 0
            fi
            sleep 2
          done
          echo "Application failed to start"
          kill $APP_PID || true
          exit 1

      - name: Package
        run: mvn -B -ntp package -DskipTests

      - uses: actions/upload-artifact@v4
        with:
          name: stemotion-be-jar
          path: target/*.jar
          retention-days: 7
