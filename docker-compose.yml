services:
  minio:
    image: minio/minio:latest
    container_name: stemotion-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stemotion
      MINIO_ROOT_PASSWORD: stemotion123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - stemotion_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stemotion-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
      DB_USERNAME: ${DB_USERNAME:-postgres.iycanfyquiojkhqgtywd}
      DB_PASSWORD: ${DB_PASSWORD:-Longtri280204!}
      JWT_SECRET: ${JWT_SECRET:-stemotion-local-dev-secret-key-change-me-in-production-min-32-bytes}
      RENDER_SERVICE_URL: ${RENDER_SERVICE_URL:-http://host.docker.internal:4000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: "http://localhost:*,http://127.0.0.1:*"
    depends_on:
      minio:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  stemotion_minio:
