services:
  postgres:
    image: postgres:16-alpine
    container_name: stemotion-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stemotion_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - stemotion_pgdata:/var/lib/postgresql/data
    # Lets `docker compose up -d --wait` block until Postgres really accepts
    # connections, instead of the app racing the container on a cold start.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stemotion_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage for rendered MP4 files, as the proposal specifies.
  minio:
    image: quay.io/minio/minio:latest
    container_name: stemotion-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stemotion
      MINIO_ROOT_PASSWORD: stemotion123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - stemotion_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stemotion_pgdata:
  stemotion_minio:
