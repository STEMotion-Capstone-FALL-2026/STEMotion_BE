# Cloud Run uses an existing, explicitly migrated database.
# Never update a shared Supabase schema as a side effect of starting an instance.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 0
      connection-timeout: 10000
      # The shared Supabase schema uses PostgreSQL enums and UUIDs, while the
      # original Flyway schema uses varchar. Let Postgres infer string parameter
      # types from their target columns so both schemas remain compatible.
      data-source-properties:
        stringtype: unspecified
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ORIGINS}
  publish:
    embed-base-url: ${EMBED_BASE_URL:}
  integration:
    ai:
      mode: ${AI_SERVICE_MODE:remote}
      base-url: ${AI_SERVICE_URL:http://localhost:8000}
      api-key: ${AI_SERVICE_KEY:}
    render:
      base-url: ${RENDER_SERVICE_URL:}
      api-key: ${RENDER_SERVICE_KEY:}
      callback-url: ${RENDER_CALLBACK_URL:}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    com.stemotion: INFO
    org.hibernate.SQL: WARN
