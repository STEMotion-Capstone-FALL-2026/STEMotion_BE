server:
  port: ${PORT:8080}

spring:
  application:
    name: stemotion-be

  datasource:
    # Matches docker-compose.yml, which maps the container's 5432 to 5433
    # so it does not clash with a Postgres already installed on the machine.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      # Let Hibernate automatically add missing columns during development
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  cors:
    # Patterns; "*" matches any port so a shifted Vite port still works in dev.
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

  publish:
    embed-base-url: ${EMBED_BASE_URL:http://localhost:3000/embed}

  integration:
    ai:
      mode: ${AI_SERVICE_MODE:embedded}
      base-url: ${AI_SERVICE_URL:http://localhost:8000}
      api-key: ${AI_SERVICE_KEY:}
    render:
      base-url: ${RENDER_SERVICE_URL:http://localhost:4000}
      api-key: ${RENDER_SERVICE_KEY:}
      callback-url: ${RENDER_CALLBACK_URL:http://localhost:8080/api/v1/render/callback}
      timeout-seconds: 30
      max-attempts: 3
    gemini:
      # Never hard-code the key here: this file is committed. Put it in .env.
      api-key: ${GEMINI_API_KEY:}
      base-url: https://generativelanguage.googleapis.com/v1beta
      model: ${GEMINI_MODEL:gemini-3.6-flash}
      timeout-seconds: 60
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    root: INFO
    com.stemotion: DEBUG
    org.hibernate.SQL: DEBUG
