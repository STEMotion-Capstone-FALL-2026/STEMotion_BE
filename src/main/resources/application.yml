server:
  port: 8080

spring:
  application:
    name: stemotion-be

  datasource:
    # Matches docker-compose.yml, which maps the container's 5432 to 5433
    # so it does not clash with a Postgres already installed on the machine.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/stemotion_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities match it.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:stemotion-local-dev-secret-key-change-me-in-production-min-32-bytes}
    expiration-ms: 86400000
  cors:
    # Patterns; "*" matches any port so a shifted Vite port still works in dev.
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

  publish:
    embed-base-url: ${EMBED_BASE_URL:http://localhost:3000/embed}

  integration:
    render:
      base-url: ${RENDER_SERVICE_URL:http://localhost:4000}
      api-key: ${RENDER_SERVICE_KEY:}
      callback-url: ${RENDER_CALLBACK_URL:http://localhost:8080/api/v1/render/callback}
      timeout-seconds: 30
      max-attempts: 3
    gemini:
      # Never hard-code the key here: this file is committed. Put it in .env.
      api-key: ${GEMINI_API_KEY:}
      base-url: https://generativelanguage.googleapis.com/v1beta
      model: ${GEMINI_MODEL:gemini-1.5-flash}
      timeout-seconds: 60
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    root: INFO
    com.stemotion: DEBUG
    org.hibernate.SQL: DEBUG
