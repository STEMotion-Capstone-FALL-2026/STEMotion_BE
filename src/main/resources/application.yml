server:
  port: 8080

spring:
  application:
    name: stemotion-be

  datasource:
    url: jdbc:postgresql://localhost:5433/stemotion_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:stemotion-local-dev-secret-key-change-me-in-production-min-32-bytes}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

  publish:
    embed-base-url: ${EMBED_BASE_URL:http://localhost:5173/embed}

  integration:
    render:
      base-url: ${RENDER_SERVICE_URL:http://localhost:4000}
      api-key: ${RENDER_SERVICE_KEY:}
      callback-url: ${RENDER_CALLBACK_URL:http://localhost:8080/api/v1/render/callback}
      timeout-seconds: 30
      max-attempts: 3
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: https://generativelanguage.googleapis.com/v1beta
      model: ${GEMINI_MODEL:gemini-3.6-flash}
      timeout-seconds: 60
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.stemotion: DEBUG
    org.hibernate.SQL: DEBUG

gemini:
  api:
    key: AQ.Ab8RN6KWHIM3wnn5PqWFqfCwOC91bwKgYryFF8dUaA95lihUuA
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

