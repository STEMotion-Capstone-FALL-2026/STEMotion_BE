server:
  port: ${PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: stemotion-be

  datasource:
    # Matches docker-compose.yml, which maps the container's 5432 to 5433
    # so it does not clash with a Postgres already installed on the machine.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      # Tables added from V10 on (ai_requests, clips, publications) use uuid
      # columns while the entities hold ids as strings. Let Postgres infer the
      # type of string parameters from the target column, as the cloud profile
      # does; without it every AI call failed to log and returned HTTP 500.
      data-source-properties:
        stringtype: unspecified

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      # Auth v2 schema changes are reviewed explicitly; never auto-update a shared DB.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Counts statements per request for the "api … q=N" log line (no SQL is logged).
        session_factory:
          statement_inspector: com.stemotion.core.metrics.QueryCountInspector
    open-in-view: false

app:
  notification-email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    provider: ${NOTIFICATION_EMAIL_PROVIDER:local}
    api-key: ${BREVO_API_KEY:}
    from-address: ${NOTIFICATION_EMAIL_FROM_ADDRESS:}
    from-name: ${NOTIFICATION_EMAIL_FROM_NAME:STEMotion}
    public-url: ${APP_PUBLIC_URL:http://localhost:3000}
    connect-timeout-ms: ${NOTIFICATION_EMAIL_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${NOTIFICATION_EMAIL_READ_TIMEOUT_MS:10000}
    max-attempts: ${NOTIFICATION_EMAIL_MAX_ATTEMPTS:5}
    poll-interval-ms: ${NOTIFICATION_EMAIL_POLL_INTERVAL_MS:10000}
    resend-cooldown-seconds: ${NOTIFICATION_EMAIL_RESEND_COOLDOWN_SECONDS:60}
  auth-v2:
    enabled: ${AUTH_V2_ENABLED:false}
    google-enabled: ${GOOGLE_LOGIN_ENABLED:false}
  draft:
    require-base-revision: ${DRAFT_REQUIRE_BASE_REVISION:false}
  video:
    # Paid-capable operation: off until provider, model and budget have been configured.
    storyboard-enabled: ${VIDEO_STORYBOARD_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  cors:
    # Patterns; "*" matches any port so a shifted Vite port still works in dev.
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

  publish:
    embed-base-url: ${EMBED_BASE_URL:http://localhost:3000/embed}

  youtube:
    enabled: ${APP_YOUTUBE_ENABLED:false}
    client-id: ${YOUTUBE_CLIENT_ID:}
    client-secret: ${YOUTUBE_CLIENT_SECRET:}
    token-key: ${YOUTUBE_TOKEN_KEY:}
    redirect-uri: ${YOUTUBE_REDIRECT_URI:http://localhost:8080/api/v1/youtube/oauth/callback}
    return-url: ${YOUTUBE_RETURN_URL:http://localhost:3000/workspaces/%s/settings}
    auth-url: ${YOUTUBE_AUTH_URL:https://accounts.google.com/o/oauth2/v2/auth}
    token-url: ${YOUTUBE_TOKEN_URL:https://oauth2.googleapis.com/token}
    revoke-url: ${YOUTUBE_REVOKE_URL:https://oauth2.googleapis.com/revoke}
    api-base-url: ${YOUTUBE_API_BASE_URL:https://www.googleapis.com}
    upload-base-url: ${YOUTUBE_UPLOAD_BASE_URL:https://www.googleapis.com/upload/youtube/v3/videos}

  integration:
    google:
      # Google Sign-In for accounts an admin already created (matched by verified email).
      client-id: ${GOOGLE_CLIENT_ID:}
    ai:
      alignment-worker-key: ${AI_ALIGNMENT_WORKER_KEY:}
      mode: ${AI_SERVICE_MODE:remote}
      base-url: ${AI_SERVICE_URL:http://localhost:8000}
      api-key: ${AI_SERVICE_SHARED_KEY:${AI_SERVICE_KEY:}}
    render:
      base-url: ${RENDER_SERVICE_URL:http://localhost:4000}
      api-key: ${RENDER_SERVICE_KEY:}
      callback-url: ${RENDER_CALLBACK_URL:http://localhost:8080/api/v1/render/callback}
      timeout-seconds: 30
      max-attempts: 3
    gemini:
      # Never hard-code the key here: this file is committed. Put it in .env.
      api-key: ${GEMINI_API_KEY:}
      base-url: https://generativelanguage.googleapis.com/v1beta
      model: ${GEMINI_MODEL:gemini-3.6-flash}
      timeout-seconds: 60
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    root: INFO
    com.stemotion: DEBUG
    org.hibernate.SQL: DEBUG
