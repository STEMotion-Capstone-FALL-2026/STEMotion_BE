services:
  - type: web
    name: stemotion-be-staging
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    autoDeployTrigger: off
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: JAVA_TOOL_OPTIONS
        value: -Xms64m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Djava.security.egd=file:/dev/./urandom
      - key: DB_POOL_SIZE
        value: "3"
      - key: SERVER_TOMCAT_THREADS_MAX
        value: "20"
      - key: SERVER_TOMCAT_THREADS_MIN_SPARE
        value: "2"
      - key: CORS_ORIGINS
        value: https://stemotion.vercel.app,https://ste-motion-fe.vercel.app,http://localhost:3000,http://localhost:5173
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
